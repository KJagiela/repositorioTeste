<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG City</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">

    <style>

        body{
          background-image: url('./esse.png');
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
          height: 100vh;
        }
    
      </style>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container"> 
                <a class="corzinha" href="navbar-brand">RPG City</a> 

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                 <span class="navbar-toggler-icon"> </span>
            </button>
            <div class="collapse navbar-collapse"> 
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Início</a> </li>
                    <li class="nav-item"><a class="nav-link" href="./informações.html">Mais Informações</a> </li>
                </ul>
            </div>
        </div>
    </nav>
<section>

    <div class="container">
        <div class="row vh-100 justify-content-center align-items-center">

            <div class="col-md-5">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">Cadastro</h2>

                    <form>

                       
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" placeholder="Digite seu nome">
                        </div>

                    
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" placeholder="Digite seu e-mail">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" placeholder="Digite sua senha">
                        </div>

                        <div class="d-grid">
                            <a href="./index.html" class="btn btn-primary btn-lg mt-3">
                            <button type="submit" class="btn btn-primary">
                                Cadastrar
                            </button>
                            </a>
                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>
</section>
    
</body>
</html>
